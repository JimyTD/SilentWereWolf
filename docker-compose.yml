services:
  # 应用服务（后端 + 前端静态文件）
  silentwerewolf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silentwerewolf-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
    env_file:
      - path: ${SILENTWEREWOLF_ENV_FILE:-/root/silentwerewolf-secrets/silentwerewolf.env}
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - silentwerewolf-network
    # 不对外暴露端口，仅通过 nginx 访问

  # Nginx 反向代理（WebSocket 支持）
  nginx:
    image: nginx:alpine
    container_name: silentwerewolf-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      silentwerewolf:
        condition: service_healthy
    networks:
      - silentwerewolf-network

networks:
  silentwerewolf-network:
    name: silentwerewolf-network
    driver: bridge
